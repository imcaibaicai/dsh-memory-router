# dsh-memory-router —— 跨会话记忆路由
#
# 分层披露：L0 核心记忆 + 归档索引常驻注入；L1 每轮按话题自动召回命中正文；
# L2 用 mem_recall / mem_get / mem_index 按需拉取。
#
# 所有可调项在 lib/index.js 的 DEFAULTS 里都有默认值；下面只列出最常改的几个。
# 注意：本行 config 一旦在 profile 的 cordis.patch.yml 里被覆盖，就是**整体替换**，
#      没写到的键会回落到代码默认值（不会丢功能）。
- insert:
    - id: memory-router
      name: 'dsh-memory-router'
      config:
        # 常驻注入预算（字符）。先用保守值，靠 mem_stats 的记账数据再调。
        coreBudgetChars: 5000
        indexBudgetChars: 2000
        # 每轮自动召回：命中就注入一张召回卡，命中为 0 时零成本不打扰。
        autoRecall: true
        recallTopK: 5
